app:
  name: "QuantAgent-Alpha"
  version: "1.0.0"
  description: "Institutional Multi-Agent Quantitative Intelligence & Investment Thesis Engine"
  author: "Gabriel Proaño"

quant:
  benchmark_ticker: "^GSPC" # S&P 500
  risk_free_rate: 0.045     # 4.5% annual risk-free rate proxy (Fed Funds / 3M T-Bill)
  default_period: "1y"
  default_interval: "1d"
  ema_fast: 20
  ema_medium: 50
  ema_slow: 200
  rsi_period: 14
  rsi_oversold: 30.0
  rsi_overbought: 70.0
  bollinger_window: 20
  bollinger_std: 2.0
  fibonacci_window: 60

macro:
  fed_funds_proxy: 0.0525
  inflation_proxy: 0.029
  vix_low_threshold: 15.0
  vix_high_threshold: 25.0
  yield_curve_inverted_threshold: 0.0

risk:
  min_sharpe_ratio: 0.75
  max_drawdown_limit: 0.28
  var_confidence: 0.95
  max_portfolio_allocation: 0.20
  target_volatility: 0.18
  fractional_kelly: 0.5

system:
  cache_dir: "data/cache"
  log_level: "INFO"
